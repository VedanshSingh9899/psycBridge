# One stack: postgres (truth) + redis (live routing) + backend + frontend.
# Usage:
#   cp .env.example .env   # then edit POSTGRES_PASSWORD
#   docker compose up -d --build
#   frontend: http://localhost:5173/  pro: http://pro.localhost:5173/  admin: http://admin.localhost:5173/
#   backend:  http://localhost:3000/api/v1/health
# Only backend :3000 and frontend :5173 are published; PG/Redis stay on the
# internal network (psql/redis-cli via `docker compose exec`).

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: psycbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # PG18+: mount the parent dir (data lives in a versioned subdir)
      - pgdata:/var/lib/postgresql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d psycbridge"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/psycbridge
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    ports:
      - "5173:80"
    depends_on:
      - backend

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
